<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Stenoip.com</title>
        <link rel="icon" href="stenoip_company_mini.png" type="image/png" />

        <!-- Copyright Stenoip Company 2026. All rights reserved.-->
        <style>
            html, body {
                background-color: orange;
                color: white;
                font-family: arial;
              	margin: 0;
                overflow-x: hidden;
                overflow-y: hidden;
                
            }
            #logo {
                border:  solid yellow;
                width: 200px;
              	box-shadow: 9px 9px 9px black;
            }
          
          h5 {
            margin-top: 10px;
            
          }
          
          #other-half {
            background-color: red;
            min-height: 100vh;
          }
          
          #search {
            padding: 8px;
            box-shadow: 9px 9px 9px;
            border: solid;
          }
          
          #search-btn {
            padding: 8px;
            background-color: green;
            color: white;
            box-shadow: 9px 9px 9px black;
          	border: none;
          }
          
        </style>
    </head>
    <body>
    
        <img id="logo" src="stenoip_company_logo.png">
        <h1 id="ani-text">This is Stenoip.com (Under Construction)</h1>
      <div id="other-half">
        
       
      <hr>
      	<p>In the meantime, please use our other sites:
          
          <a href="https://stenoip.github.io/oodles">Oodles Metasearch</a>, 
          <a href="https://stenoip.github.io/ringzauber-site">Ringzauber</a> and <a href="https://stenoip.github.io/praterich">Praterich A.I</a></p>
      
  		<h5>
          Or search the web with Oodles Metasearch:
  		</h5>
        <input id="search" placeholder="Search the web"> 
        <button id="search-btn">
        Search
        </button>

          <br>
          <h6>&copy; Stenoip Company 2026. Sidenote: Stenoip Company is pronounced "Stick-no-ikp".</h6>
        
        </div> 
        <!-- Yes. I still use jQuery in 2026-->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
        <script>
        $("#logo").hide();
        $("#ani-text").hide();
        $("#logo").slideDown(1000, function() {
            $("#ani-text").fadeIn();
        });
          
          $("#search-btn").on("click", function() {
            var query = document.getElementById("search").value;
            
            
            window.location.href = "https://stenoip.github.io/oodles/search.html?q=" + encodeURIComponent(query);
 
          });
        
            
        </script>
        
    </body>
</html>
