<script>
    

    /*

    document.addEventListener('click', function(e) {
        var link = e.target.closest('a');
        if (link && link.href) {
            e.preventDefault();
            window.open(link.href, '_blank');
        }
    });


    var ourRequest = new XMLHttpRequest();
    ourRequest.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=40.9304&longitude=-73.8979&current=temperature_2m,wind_speed_10m,precipitation");
    ourRequest.onload = function() {
        // Card 1
        var tempText = document.getElementById("temperature");
        var windText = document.getElementById("wind-gust");

        // Card 3
        var rainText = document.getElementById("rain-statement");
        var rainSubtext = document.getElementById("rain-details");
        var rainCard = document.getElementById("rain-card")
        
        var currJSON = JSON.parse(ourRequest.responseText);
        var temperatures = currJSON.current.temperature_2m;

        // var temperatures = 37; 

        var windGust = currJSON.current.wind_speed_10m; 
        var precipitation = currJSON.current.precipitation;
        
        // var precipitation = 5.5;

        tempText.innerHTML = temperatures + "°C";
        windText.innerHTML = "Wind speed is <strong>" + windGust + "</strong> km/h!";
        rainSubtext.innerHTML = "The precipitation is <strong>" + precipitation + "</strong> millimetres!";

        // Changes the background to a cool blue/dark gradient if it's under 15°C
        function tempCheck() {
            if (temperatures < 0) {
                document.body.style.backgroundImage = "linear-gradient(to top, rgb(40, 40, 60), rgb(80, 100, 140))";
                
            }

            if (temperatures <= 19 && temperatures > 0) {
                document.body.style.backgroundImage = "linear-gradient(to top, rgb(10, 30, 60), rgb(120, 200, 240))";
            }

            else if (temperatures >= 19 && temperatures <= 37){
                return
            }

            else if (temperatures > 37) {
                document.body.style.backgroundImage = "linear-gradient(to top, rgb(0, 0, 0), rgb(10, 10, 10))";
            }
        }

        tempCheck();


        function rainCheck() {
            if (precipitation < 0.1) {
                rainText.innerHTML = "No Rain!"
                rainCard.style.backgroundImage = "url('sun-and-hills.jpg')"
            }
             
            else if (precipitation > 0.1 && precipitation <= 0.5) {
                rainText.innerHTML = "Drizzle Outside"
            }
            
            else if (precipitation > 0.5 && precipitation <= 2.5) {
                rainText.innerHTML = "It's Raining (Light)"
            }

            else if (precipitation > 2.5 && precipitation <= 7.5) {
                rainText.innerHTML = "It's Raining"
            }

            else  {
                rainText.innerHTML = "DANGER! HEAVY RAIN!"
                rainCard.style.backgroundImage = "url('storm.gif')";
            }
          
        }

        rainCheck();



    };

        ourRequest.send();

    var ourNewsRequest = new XMLHttpRequest();    
    ourNewsRequest.open("GET", "https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Ffeeds.bbci.co.uk%2Fnews%2Frss.xml")
    ourNewsRequest.onload = function() {
        var currNewsJSON = JSON.parse(ourNewsRequest.responseText);
        var news = currNewsJSON.items;

            

          

        for (var i = 0; i < 6; i++) {
            var newsContainer = document.getElementById("news-grid");
            var newsItem = document.createElement("div");

            newsItem.innerHTML = `
                <section id=''>
                    <img src=' ` + currNewsJSON.items[i].enclosure.thumbnail +`'>
                    <a href=" `+ currNewsJSON.items[i].link + ` "><h3 id='news-title'>` + currNewsJSON.items[i].title + `</h3></a>
                    
                    <p id=''> `+ currNewsJSON.items[i].description + ` </p>

                </section>
            `

            newsContainer.appendChild(newsItem)

            
        }
        

        

    };

   ourNewsRequest.send();


</script>
